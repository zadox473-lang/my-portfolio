    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #22d3ee;
            --neon-purple: #a855f7;
        }
        body {
            background-color: #020617;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Matrix Background Animation */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.85)),
                        url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXZueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueXpueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpxxcaqc9A7S/giphy.gif');
            background-size: cover;
            z-index: -1;
            opacity: 0.5;
        }

        .glow-text-cyan { text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
        .glow-text-purple { text-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple); }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-click:active { transform: scale(0.96); }
        .card-hover:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }

        .ios-emoji { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }

        #music-toggle.playing {
            box-shadow: 0 0 15px var(--neon-purple);
            border-color: var(--neon-purple);
        }
    </style>
</head>
